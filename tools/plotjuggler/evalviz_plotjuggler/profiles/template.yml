# Copy this file next to your robot assets and replace the example bindings.
schema_version: 1
name: Example robot
clock: robot_clock
frames:
  world: map
  tracked: base_link
robot:
  root_frame: base_link
  urdf: robot/model.urdf
  joint_topic: /robot/joint_states
  sensor_frames:
    camera_link: camera
    imu_link: imu
    lidar_link: lidar
inputs:
  onboard:
    role: estimate
    topic: /robot/odom
    message_type: nav_msgs/msg/Odometry
    required: true
  joints:
    role: joints
    topic: /robot/joint_states
    message_type: sensor_msgs/msg/JointState
  tf:
    role: tf
    topic: /tf
    message_type: tf2_msgs/msg/TFMessage
  tf_static:
    role: tf_static
    topic: /tf_static
    message_type: tf2_msgs/msg/TFMessage
  image:
    role: image
    topic: /robot/camera/image_raw
    message_type: sensor_msgs/msg/Image
  cloud:
    role: point_cloud
    topic: /robot/lidar/points
    message_type: sensor_msgs/msg/PointCloud2
viewer:
  bridge_url: ws://127.0.0.1:9090
  namespace: /evalviz
  retention_s: 30.0
capture:
  topics:
    - /robot/odom
    - /robot/joint_states
    - /tf
    - /tf_static
