# project-ci-template: generic
name: build_cpplinux_cuda
run-name: Build and test EvalAndVizGears_for_ComputerVision with CUDA

on:
  workflow_dispatch:
    inputs:
      enable_tbb:
        description: Enable oneTBB on the configured GPU runner
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
  push:
    tags: ["v*.*.*"]

concurrency:
  group: cuda-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cuda:
    if: ${{ vars.CI_USE_SELF_HOSTED == 'true' }}
    runs-on: [self-hosted, Linux, X64, gpu, cuda]
    timeout-minutes: 90
    env:
      BUILD_DIR: build_cuda_ci
      ENABLE_TBB: ${{ github.event.inputs.enable_tbb == 'true' && 'ON' || 'OFF' }}
      CTEST_OUTPUT_ON_FAILURE: 1
      SLAM_PRIMITIVES_REVISION: 05a9c72be25692c965cf688511ac45107bfd382f
      SLAM_PRIMITIVES_ROOT: ${{ runner.temp }}/slam-primitives-${{ github.run_id }}-${{ github.run_attempt }}
      SLAM_PRIMITIVES_INSTALL: ${{ runner.temp }}/slam-primitives-install-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate CUDA runner
        run: |
          command -v cmake
          command -v ninja
          command -v g++
          command -v nvcc
          command -v nvidia-smi
          command -v python3
          python3 -m pytest --version
          nvidia-smi
          nvcc --version

      - name: Configure
        run: |
          git clone https://github.com/PeterCalifano/slam-primitives.git \
            "${SLAM_PRIMITIVES_ROOT}"
          git -C "${SLAM_PRIMITIVES_ROOT}" checkout \
            --detach "${SLAM_PRIMITIVES_REVISION}"
          cmake -S "${SLAM_PRIMITIVES_ROOT}" \
            -B "${SLAM_PRIMITIVES_ROOT}/build-ci" -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_INSTALL_PREFIX="${SLAM_PRIMITIVES_INSTALL}" \
            -DENABLE_TESTS=OFF \
            -Dslam-primitives_BUILD_PROGRAMS=OFF \
            -Dslam-primitives_BUILD_EXAMPLES=OFF \
            -DCPU_ENABLE_NATIVE_TUNING=OFF
          cmake --build "${SLAM_PRIMITIVES_ROOT}/build-ci" \
            --target install --parallel 4
          cmake -S . -B "${BUILD_DIR}" -GNinja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_PREFIX_PATH="${SLAM_PRIMITIVES_INSTALL}" \
            -DENABLE_TESTS=ON \
            -DENABLE_PYTHON_TESTS=ON \
            -DENABLE_CUDA=ON \
            -DENABLE_TBB="${ENABLE_TBB}" \
            -DENABLE_OPENGL=OFF \
            -DCPU_ENABLE_NATIVE_TUNING=OFF \
            -DCUDA_ENABLE_FMAD=ON \
            -DCUDA_ENABLE_EXTRA_DEVICE_VECTORIZATION=ON

      - name: Build
        run: cmake --build "${BUILD_DIR}" --parallel 4

      - name: Test
        run: ctest --test-dir "${BUILD_DIR}" --output-on-failure --parallel 2 --no-tests=error
